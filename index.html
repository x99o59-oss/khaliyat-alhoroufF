
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خلية الحروف</title>
<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#8954ee;
 font-family:Tahoma;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow-x:hidden;
}

.game{
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:35px;
 flex-wrap:wrap;
 padding:20px;
 isolation:isolate;
}

.game::before{
 content:"";
 position:absolute;
 z-index:-1;
 background:#ff7818;
 width:90%;
 height:220px;
 top:50%;
 left:5%;
 transform:translateY(-50%);
 clip-path:polygon(0 25%,100% 0,100% 75%,0 100%);
}

.board{
 display:flex;
 flex-direction:column;
 gap:0;
}

.board{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:0;
}

.hex-row{
 display:flex;
 justify-content:center;
 margin-top:-14px;
}

.hex-row:first-child{
 margin-top:0;
}

.hex-row:nth-child(even){
 transform:translateX(54px);
}

.hex{
 width:110px;
 height:112px;
 background:#572b83;
 clip-path:polygon(
 25% 0,75% 0,100% 50%,
 75% 100%,25% 100%,0 50%
 );
 display:grid;
 place-items:center;
 padding:5px;
 border:0;
}

.hex span{
 width:100%;
 height:100%;
 background:#fff;
 color:#572b83;
 clip-path:polygon(
 25% 0,75% 0,100% 50%,
 75% 100%,25% 100%,0 50%
 );
 display:grid;
 place-items:center;
 font-size:40px;
 font-weight:bold;
}

@media(max-width:600px){
 .hex{width:67px;height:76px}
 .hex-row:nth-child(even){
  transform:translateX(33px);
 }
 .hex-row{margin-top:-9px}
 .hex-row:first-child{margin-top:0}
 .hex span{font-size:28px}
}
.new-round{
 margin-top:20px;
 padding:12px 30px;
 border:0;
 border-radius:12px;
 background:#fff;
 color:#8954ee;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
}
/* الفريق الأخضر */
.hex.green span{
 background:#20c96b;
 color:white;
}

/* الفريق البرتقالي */
.hex.orange span{
 background:#ff7818;
 color:white;
}
</style>
</head>
<body>
<div class="game">
<div id="board" class="board"></div>
<button onclick="newRound()" class="new-round">
 جولة جديدة
</button>
</div>





<script>
const letters=[
 'ا','ب','ت','ث','ج','ح','خ','د','ذ','ر',
 'ز','س','ش','ص','ض','ط','ظ','ع','غ','ف',
 'ق','ك','ل','م','ن','ه','و','ي','أ','ة'
];

const board=document.getElementById('board');
let currentTeam='green';
let gameOver=false;
let cells=[];

function newRound(){
 board.innerHTML='';
 currentTeam='green';
 gameOver=false;
 cells=[];

 const shuffled=[...letters].sort(()=>Math.random()-0.5);

 for(let r=0;r<5;r++){
  const row=document.createElement('div');
  row.className='hex-row';
  cells[r]=[];

  for(let c=0;c<5;c++){
   const cell=document.createElement('div');
   cell.className='hex';
   cell.dataset.r=r;
   cell.dataset.c=c;

   const span=document.createElement('span');
   span.textContent=shuffled[r*5+c];

   cell.appendChild(span);

   cell.onclick=()=>{
    if(gameOver || cell.classList.contains('green') ||
       cell.classList.contains('orange')) return;

    cell.classList.add(currentTeam);
    cells[r][c]=currentTeam;

    if(checkWinner(currentTeam)){
     gameOver=true;
     alert(currentTeam==='green'
      ? 'فاز الفريق الأخضر! 🟢'
      : 'فاز الفريق البرتقالي! 🟠');
     return;
    }

    currentTeam=currentTeam==='green'
      ? 'orange' : 'green';
   };

   cells[r][c]=null;
   row.appendChild(cell);
  }

  board.appendChild(row);
 }
}

function checkWinner(team){
 const visited=new Set();
 const queue=[];

 for(let i=0;i<5;i++){
  if(team==='green' && cells[0][i]===team)
   queue.push([0,i]);

  if(team==='orange' && cells[i][0]===team)
   queue.push([i,0]);
 }

 while(queue.length){
  const [r,c]=queue.shift();
  const key=r+','+c;

  if(visited.has(key)) continue;
  visited.add(key);

  if(team==='green' && r===4) return true;
  if(team==='orange' && c===4) return true;

  const neighbors=[
   [r,c-1],[r,c+1],
   [r-1,c],[r+1,c],
   [r-1,c+(r%2===0?1:-1)],
   [r+1,c+(r%2===0?1:-1)]
  ];

  for(const [nr,nc] of neighbors){
   if(nr>=0 && nr<5 && nc>=0 && nc<5 &&
      cells[nr][nc]===team &&
      !visited.has(nr+','+nc)){
    queue.push([nr,nc]);
   }
  }
 }

 return false;
}

newRound();
</script>




</body>
</html>
