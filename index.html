
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خلية الحروف</title>
<style>
*{box-sizing:border-box}


body{
 margin:0;
 background:
  radial-gradient(ellipse at 50% 45%, #6634b5 0%, #32145f 65%, #190b32 100%);
 font-family:Tahoma;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow-x:hidden;
}


.game{
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:35px;
 flex-wrap:wrap;
 padding:20px;
 isolation:isolate;
}


.game::before{
 content:"";
 position:absolute;
 z-index:-1;
 background:linear-gradient(135deg,#ff9b35,#ff641f,#d943ff);
 width:100%;
 height:250px;
 top:50%;
 left:0;
 transform:translateY(-50%);
 clip-path:polygon(0 25%,100% 0,100% 75%,0 100%);
 filter:drop-shadow(0 0 20px #ff7818);
}


.board{
 display:flex;
 flex-direction:column;
 gap:0;
}

.board{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:0;
}

.hex-row{
 display:flex;
 justify-content:center;
 margin-top:-14px;
}

.hex-row:first-child{
 margin-top:0;
}

.hex-row:nth-child(even){
 transform:translateX(54px);
}


.hex{
 width:110px;
 height:112px;
 background:linear-gradient(135deg,#b77aff,#5424a0);
 clip-path:polygon(
 25% 0,75% 0,100% 50%,
 75% 100%,25% 100%,0 50%
 );
 display:grid;
 place-items:center;
 padding:5px;
 filter:drop-shadow(0 0 8px rgba(190,120,255,.7));
 transition:transform .2s,filter .2s;
}

.hex:active{
 transform:scale(.94);
}



.hex span{
 width:100%;
 height:100%;
 background:linear-gradient(145deg,#ffffff,#e8ddff);
 color:#572b83;
 clip-path:polygon(
 25% 0,75% 0,100% 50%,
 75% 100%,25% 100%,0 50%
 );
 display:grid;
 place-items:center;
 font-size:40px;
 font-weight:bold;
 text-shadow:0 1px 1px rgba(0,0,0,.12);
}


@media(max-width:600px){
 .hex{width:67px;height:76px}
 .hex-row:nth-child(even){
  transform:translateX(33px);
 }
 .hex-row{margin-top:-9px}
 .hex-row:first-child{margin-top:0}
 .hex span{font-size:28px}
}

.new-round{
 margin-top:20px;
 padding:15px 35px;
 border:2px solid #d9b8ff;
 border-radius:15px;
 background:linear-gradient(135deg,#b66aff,#7135c7);
 color:white;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
 box-shadow:0 0 12px #a95aff,0 0 25px rgba(169,90,255,.4);
 transition:.2s;
}

.new-round:active{
 transform:scale(.95);
}

/* الفريق الأخضر */
/* الحرف الأصفر */
.hex.selected span{
 background:linear-gradient(145deg,#fff36a,#ffc928);
 color:#533300;
}

/* الفريق الأخضر */
.hex.green span{
 background:linear-gradient(145deg,#42f59b,#08a85b);
 color:white;
}

/* الفريق البرتقالي */
.hex.orange span{
 background:linear-gradient(145deg,#ffad55,#ff6418);
 color:white;
}

/* شاشة الفوز */
.winner-box{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(10,4,25,.85);
 backdrop-filter:blur(8px);
 z-index:100;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.winner-content{
 background:linear-gradient(145deg,#fff,#eee5ff);
 padding:35px 25px;
 border-radius:25px;
 text-align:center;
 width:100%;
 max-width:330px;
 box-shadow:0 0 35px rgba(190,120,255,.5);
}

.winner-content h2{
 font-size:30px;
 color:#20c96b;
}

.winner-content button{
 background:linear-gradient(135deg,#a45cff,#6631bd);
 color:white;
 border:0;
 padding:13px 25px;
 border-radius:12px;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
}

.game-title{
 position:absolute;
 top:25px;
 left:0;
 right:0;
 width:100%;
 text-align:center;
 z-index:2;
}

.game-title h1{
 color:white;
 font-size:38px;
 margin:0 0 10px;
 text-shadow:
 0 0 8px #c58aff,
 0 0 20px #a34dff,
 0 0 35px #8b35ff;
}

.game-title p{
 color:#e7d7ff;
 font-size:15px;
 margin:0;
}

.game{
 margin-top:100px;
}

@media(max-width:600px){
 .game-title h1{
  font-size:30px;
 }
}
@media(max-width:600px){
 .game{
  width:100%;
  padding:15px 8px;
  margin-top:90px;
  gap:20px;
 }

 .game::before{
  width:96%;
  left:2%;
  height:190px;
 }

 .new-round{
  width:80%;
  max-width:280px;
 }
}
.board{
 padding:18px;
 border:2px solid rgba(210,170,255,.45);
 border-radius:22px;
 background:rgba(35,12,70,.35);
 box-shadow:
 0 0 15px rgba(180,110,255,.25),
 inset 0 0 15px rgba(180,110,255,.15);
}
@keyframes fadeInGame{
 from{
  opacity:0;
  transform:translateY(20px);
 }
 to{
  opacity:1;
  transform:translateY(0);
 }
}

.game{
 animation:fadeInGame .8s ease-out;
}

.game-title{
 animation:fadeInGame 1s ease-out;
}

.hex{
 animation:fadeInGame .5s ease-out both;
}
.game{
 width:100%;
 max-width:900px;
 min-height:80vh;
 margin-top:110px;
 padding:25px 15px;
}

.game-title{
 top:25px;
}

.board{
 position:relative;
 z-index:1;
}

@media(max-width:600px){
 body{
  align-items:flex-start;
 }

 .game{
  margin-top:105px;
  min-height:auto;
  padding:20px 5px;
 }

 .board{
  padding:10px 5px;
 }

 .hex-row:nth-child(even){
  transform:translateX(30px);
 }
}
</style>
</head>
<body>
  <div class="game-title">
 <h1>خلية الحروف</h1>
 <p>تحدّى منافسك واربط الحروف للفوز!</p>
</div>
<div class="game">
<div id="board" class="board"></div>



<button onclick="newRound()" class="new-round">
 جولة جديدة
</button>
</div>
<div class="winner-box" id="winnerBox">
 <div class="winner-content">
  <h2 id="winnerTitle">مبروك الفوز!</h2>
  <p>أحسنتم! فاز الفريق 🎉</p>
  <button onclick="newRound(); closeWinner();">
   جولة جديدة
  </button>
 </div>
</div>








<script>
const letters=[
 'ا','ب','ت','ث','ج','ح','خ','د','ذ','ر',
 'ز','س','ش','ص','ض','ط','ظ','ع','غ','ف',
 'ق','ك','ل','م','ن','ه','و','ي','أ','ة'
];

const board=document.getElementById('board');

let gameOver=false;
let cells=[];

function newRound(){
 board.innerHTML='';
 gameOver=false;
 cells=[];

 document.getElementById('winnerBox').style.display='none';

 const shuffled=[...letters].sort(()=>Math.random()-0.5);

 for(let r=0;r<5;r++){
  const row=document.createElement('div');
  row.className='hex-row';
  cells[r]=[];

  for(let c=0;c<5;c++){
   const cell=document.createElement('div');
   cell.className='hex';

   const span=document.createElement('span');
   span.textContent=shuffled[r*5+c];

   cell.appendChild(span);
   cells[r][c]='white';

   cell.onclick=()=>{
    if(gameOver) return;

    // الأبيض يتحول إلى أصفر
    if(cells[r][c]==='white'){
     cells[r][c]='yellow';
     cell.classList.add('selected');
     return;
    }

    // الأصفر: الضغطة الأولى تجعله أخضر
    if(cells[r][c]==='yellow'){
     cells[r][c]='green';
     cell.classList.remove('selected');
     cell.classList.add('green');

     if(checkWinner('green')) showWinner('green');
     return;
    }

    // الأخضر يبقى ثابتاً
    if(cells[r][c]==='green') return;

    // البرتقالي يرجع أبيض
    if(cells[r][c]==='orange'){
     cells[r][c]='white';
     cell.classList.remove('orange');
    }
   };

   // ضغطتان على الأصفر تجعله برتقالياً
   let pressTimer=null;
   let pressCount=0;

   cell.addEventListener('dblclick',()=>{
    if(gameOver || cells[r][c]!=='yellow') return;

    cells[r][c]='orange';
    cell.classList.remove('selected');
    cell.classList.add('orange');

    if(checkWinner('orange')) showWinner('orange');
   });

   row.appendChild(cell);
  }

  board.appendChild(row);
 }
}

function showWinner(team){
 gameOver=true;

 const title=document.getElementById('winnerTitle');
 title.textContent=team==='green'
  ? 'فاز الفريق الأخضر! 🟢'
  : 'فاز الفريق البرتقالي! 🟠';

 title.style.color=team==='green'
  ? '#20c96b'
  : '#ff7818';

 document.getElementById('winnerBox').style.display='flex';
}

function checkWinner(team){
 const visited=new Set();
 const queue=[];

 for(let i=0;i<5;i++){
  if(team==='green' && cells[0][i]===team) queue.push([0,i]);
  if(team==='orange' && cells[i][0]===team) queue.push([i,0]);
 }

 while(queue.length){
  const [r,c]=queue.shift();
  const key=r+','+c;

  if(visited.has(key)) continue;
  visited.add(key);

  if(team==='green' && r===4) return true;
  if(team==='orange' && c===4) return true;

  const left=r%2===0?-1:0;
  const right=r%2===0?0:1;

  const neighbors=[
   [r,c-1],[r,c+1],
   [r-1,c+left],[r-1,c+right],
   [r+1,c+left],[r+1,c+right]
  ];

  for(const [nr,nc] of neighbors){
   if(nr>=0 && nr<5 && nc>=0 && nc<5 &&
      cells[nr][nc]===team &&
      !visited.has(nr+','+nc)){
    queue.push([nr,nc]);
   }
  }
 }

 return false;
}

function closeWinner(){
 document.getElementById('winnerBox').style.display='none';
}

newRound();
</script>








</body>
</html>
