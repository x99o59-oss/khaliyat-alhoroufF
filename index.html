
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خلية الحروف</title>
<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#8954ee;
 font-family:Tahoma;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow-x:hidden;
}

.game{
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:35px;
 flex-wrap:wrap;
 padding:20px;
 isolation:isolate;
}

.game::before{
 content:"";
 position:absolute;
 z-index:-1;
 background:#ff7818;
 width:90%;
 height:220px;
 top:50%;
 left:5%;
 transform:translateY(-50%);
 clip-path:polygon(0 25%,100% 0,100% 75%,0 100%);
}

.board{
 display:flex;
 flex-direction:column;
 gap:0;
}
.
.board{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:0;
}

.hex-row{
 display:flex;
 justify-content:center;
 margin-top:-14px;
}

.hex-row:first-child{
 margin-top:0;
}

.hex-row:nth-child(even){
 transform:translateX(54px);
}

.hex{
 width:110px;
 height:112px;
 background:#572b83;
 clip-path:polygon(
 25% 0,75% 0,100% 50%,
 75% 100%,25% 100%,0 50%
 );
 display:grid;
 place-items:center;
 padding:5px;
 border:0;
}

.hex span{
 width:100%;
 height:100%;
 background:#fff;
 color:#572b83;
 clip-path:polygon(
 25% 0,75% 0,100% 50%,
 75% 100%,25% 100%,0 50%
 );
 display:grid;
 place-items:center;
 font-size:40px;
 font-weight:bold;
}

@media(max-width:600px){
 .hex{width:67px;height:76px}
 .hex-row:nth-child(even){
  transform:translateX(33px);
 }
 .hex-row{margin-top:-9px}
 .hex-row:first-child{margin-top:0}
 .hex span{font-size:28px}
}
.new-round{
 margin-top:20px;
 padding:12px 30px;
 border:0;
 border-radius:12px;
 background:#fff;
 color:#8954ee;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
}
</style>
</head>
<body>
<div class="game">
<div id="board" class="board"></div>
<button onclick="newRound()" class="new-round">
 جولة جديدة
</button>
</div>


<script>
const letters=[
 'ا','ب','ت','ث','ج','ح','خ','د','ذ','ر',
 'ز','س','ش','ص','ض','ط','ظ','ع','غ','ف',
 'ق','ك','ل','م','ن','ه','و','ي','أ','ة'
];

const board=document.getElementById('board');

function newRound(){
 board.innerHTML='';

 const shuffled=[...letters]
  .sort(()=>Math.random()-0.5);

 for(let r=0;r<5;r++){
  const row=document.createElement('div');
  row.className='hex-row';

  for(let c=0;c<5;c++){
   const cell=document.createElement('div');
   cell.className='hex';

   const span=document.createElement('span');
   span.textContent=shuffled[r*5+c];

   cell.appendChild(span);
   row.appendChild(cell);
  }

  board.appendChild(row);
 }
}

newRound();
</script>

</body>
</html>
