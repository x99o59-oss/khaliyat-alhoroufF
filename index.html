
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خلية الحروف</title>
<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#8954ee;
 font-family:Tahoma;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow-x:hidden;
}

.game{
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:35px;
 flex-wrap:wrap;
 padding:20px;
 isolation:isolate;
}

.game::before{
 content:"";
 position:absolute;
 z-index:-1;
 background:#ff7818;
 width:90%;
 height:220px;
 top:50%;
 left:5%;
 transform:translateY(-50%);
 clip-path:polygon(0 25%,100% 0,100% 75%,0 100%);
}

.board{
 display:flex;
 flex-direction:column;
 gap:0;
}

.board{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:0;
}

.hex-row{
 display:flex;
 justify-content:center;
 margin-top:-14px;
}

.hex-row:first-child{
 margin-top:0;
}

.hex-row:nth-child(even){
 transform:translateX(54px);
}

.hex{
 width:110px;
 height:112px;
 background:#572b83;
 clip-path:polygon(
 25% 0,75% 0,100% 50%,
 75% 100%,25% 100%,0 50%
 );
 display:grid;
 place-items:center;
 padding:5px;
 border:0;
}

.hex span{
 width:100%;
 height:100%;
 background:#fff;
 color:#572b83;
 clip-path:polygon(
 25% 0,75% 0,100% 50%,
 75% 100%,25% 100%,0 50%
 );
 display:grid;
 place-items:center;
 font-size:40px;
 font-weight:bold;
}

@media(max-width:600px){
 .hex{width:67px;height:76px}
 .hex-row:nth-child(even){
  transform:translateX(33px);
 }
 .hex-row{margin-top:-9px}
 .hex-row:first-child{margin-top:0}
 .hex span{font-size:28px}
}
.new-round{
 margin-top:20px;
 padding:12px 30px;
 border:0;
 border-radius:12px;
 background:#fff;
 color:#8954ee;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
}
/* الفريق الأخضر */
.hex.green span{
 background:#20c96b;
 color:white;
}

/* الفريق البرتقالي */
.hex.orange span{
 background:#ff7818;
 color:white;
}
.winner-box{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.75);
 z-index:100;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.winner-content{
 background:white;
 padding:35px 25px;
 border-radius:22px;
 text-align:center;
 width:100%;
 max-width:330px;
}

.winner-content h2{
 font-size:30px;
 color:#20c96b;
}

.winner-content button{
 background:#8954ee;
 color:white;
 border:0;
 padding:13px 25px;
 border-radius:12px;
 font-size:18px;
 font-weight:bold;
}
.team-controls{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:12px;
}

.team-controls h3{
 color:white;
 font-size:20px;
}

.team-btn{
 padding:13px 20px;
 border:0;
 border-radius:12px;
 color:white;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

.green-btn{
 background:#20c96b;
}

.orange-btn{
 background:#ff7818;
}

/* الحرف المحدد */
.hex.selected span{
 background:#ffdf35;
 color:#572b83;
}

</style>
</head>
<body>
<div class="game">
<div id="board" class="board"></div>



<button onclick="newRound()" class="new-round">
 جولة جديدة
</button>
</div>
<div class="winner-box" id="winnerBox">
 <div class="winner-content">
  <h2 id="winnerTitle">مبروك الفوز!</h2>
  <p>أحسنتم! فاز الفريق 🎉</p>
  <button onclick="newRound(); closeWinner();">
   جولة جديدة
  </button>
 </div>
</div>








<script>
const letters=[
 'ا','ب','ت','ث','ج','ح','خ','د','ذ','ر',
 'ز','س','ش','ص','ض','ط','ظ','ع','غ','ف',
 'ق','ك','ل','م','ن','ه','و','ي','أ','ة'
];

const board=document.getElementById('board');

let gameOver=false;
let cells=[];

function newRound(){
 board.innerHTML='';
 gameOver=false;
 cells=[];

 document.getElementById('winnerBox').style.display='none';

 const shuffled=[...letters].sort(()=>Math.random()-0.5);

 for(let r=0;r<5;r++){
  const row=document.createElement('div');
  row.className='hex-row';
  cells[r]=[];

  for(let c=0;c<5;c++){
   const cell=document.createElement('div');
   cell.className='hex';

   const span=document.createElement('span');
   span.textContent=shuffled[r*5+c];

   cell.appendChild(span);
   cells[r][c]='white';

   cell.onclick=()=>{
    if(gameOver) return;

    // الأبيض يتحول إلى أصفر
    if(cells[r][c]==='white'){
     cells[r][c]='yellow';
     cell.classList.add('selected');
     return;
    }

    // الأصفر: الضغطة الأولى تجعله أخضر
    if(cells[r][c]==='yellow'){
     cells[r][c]='green';
     cell.classList.remove('selected');
     cell.classList.add('green');

     if(checkWinner('green')) showWinner('green');
     return;
    }

    // الأخضر يبقى ثابتاً
    if(cells[r][c]==='green') return;

    // البرتقالي يرجع أبيض
    if(cells[r][c]==='orange'){
     cells[r][c]='white';
     cell.classList.remove('orange');
    }
   };

   // ضغطتان على الأصفر تجعله برتقالياً
   let pressTimer=null;
   let pressCount=0;

   cell.addEventListener('dblclick',()=>{
    if(gameOver || cells[r][c]!=='yellow') return;

    cells[r][c]='orange';
    cell.classList.remove('selected');
    cell.classList.add('orange');

    if(checkWinner('orange')) showWinner('orange');
   });

   row.appendChild(cell);
  }

  board.appendChild(row);
 }
}

function showWinner(team){
 gameOver=true;

 const title=document.getElementById('winnerTitle');
 title.textContent=team==='green'
  ? 'فاز الفريق الأخضر! 🟢'
  : 'فاز الفريق البرتقالي! 🟠';

 title.style.color=team==='green'
  ? '#20c96b'
  : '#ff7818';

 document.getElementById('winnerBox').style.display='flex';
}

function checkWinner(team){
 const visited=new Set();
 const queue=[];

 for(let i=0;i<5;i++){
  if(team==='green' && cells[0][i]===team) queue.push([0,i]);
  if(team==='orange' && cells[i][0]===team) queue.push([i,0]);
 }

 while(queue.length){
  const [r,c]=queue.shift();
  const key=r+','+c;

  if(visited.has(key)) continue;
  visited.add(key);

  if(team==='green' && r===4) return true;
  if(team==='orange' && c===4) return true;

  const left=r%2===0?-1:0;
  const right=r%2===0?0:1;

  const neighbors=[
   [r,c-1],[r,c+1],
   [r-1,c+left],[r-1,c+right],
   [r+1,c+left],[r+1,c+right]
  ];

  for(const [nr,nc] of neighbors){
   if(nr>=0 && nr<5 && nc>=0 && nc<5 &&
      cells[nr][nc]===team &&
      !visited.has(nr+','+nc)){
    queue.push([nr,nc]);
   }
  }
 }

 return false;
}

function closeWinner(){
 document.getElementById('winnerBox').style.display='none';
}

newRound();
</script>








</body>
</html>
