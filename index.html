
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خلية الحروف</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#8954ee;
 font-family:Tahoma;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
}
.game{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:35px;
 flex-wrap:wrap;
 padding:20px;
}
.board{
 display:flex;
 flex-direction:column;
 gap:0;
}
.hex-row{
 display:flex;
 justify-content:center;
 margin-top:-12px;
}
.hex-row:nth-child(even){
 transform:translateX(43px);
}
.hex{
 width:88px;
 height:100px;
 background:#572b83;
 clip-path:polygon(
 25% 0,75% 0,100% 50%,
 75% 100%,25% 100%,0 50%
 );
 display:grid;
 place-items:center;
 padding:5px;
 border:0;
}
.hex span{
 width:100%;
 height:100%;
 background:white;
 color:#572b83;
 clip-path:polygon(
 25% 0,75% 0,100% 50%,
 75% 100%,25% 100%,0 50%
 );
 display:grid;
 place-items:center;
 font-size:35px;
 font-weight:bold;
}
@media(max-width:600px){
 .hex{width:65px;height:75px}
 .hex-row:nth-child(even){transform:translateX(32px)}
 .hex-row{margin-top:-9px}
 .hex span{font-size:27px}
}
</style>
</head>
<body>
<div class="game">
 <div class="board" id="board"></div>
</div>

<script>
const letters=[
 'خ','م','ب','ض','ظ',
 'ط','ث','ت','ك','ي',
 'د','ج','ح','ل','ش',
 'ف','ظ','أ','ع','س',
 'غ','ق','ر','ز','و'
];

const board=document.getElementById('board');

for(let r=0;r<5;r++){
 const row=document.createElement('div');
 row.className='hex-row';

 for(let c=0;c<5;c++){
  const cell=document.createElement('div');
  cell.className='hex';

  const span=document.createElement('span');
  span.textContent=letters[r*5+c];

  cell.appendChild(span);
  row.appendChild(cell);
 }

 board.appendChild(row);
}
</script>
</body>
</html>
